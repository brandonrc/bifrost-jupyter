[build-system]
requires = ["hatchling>=1.5.0", "hatch-nodejs-version>=0.3.2", "jupyter-builder>=1.2.0,<2"]
build-backend = "hatchling.build"

[project]
name = "bifrost_jupyter"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
classifiers = [
    "Framework :: Jupyter",
    "Framework :: Jupyter :: JupyterLab",
    "Framework :: Jupyter :: JupyterLab :: 4",
    "Framework :: Jupyter :: JupyterLab :: Extensions",
    "Framework :: Jupyter :: JupyterLab :: Extensions :: Prebuilt",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "jupyter_server>=2.13.0,<3",
    # Published Bifrost Python client (Wave 2-C Task 1). Not on PyPI: installed
    # from a GitHub release asset via a PEP 508 direct reference. Pin the version
    # here and in the README. Requires `allow-direct-references` (see
    # [tool.hatch.metadata] below). If bifrost-api ever goes private, this URL
    # install breaks and needs an authenticated asset download instead.
    "bifrost_client @ https://github.com/brandonrc/bifrost-api/releases/download/python-v0.1.4/bifrost_client-0.1.4-py3-none-any.whl",
]
dynamic = ["version", "description", "authors", "urls", "keywords"]

[project.optional-dependencies]
dev = [
    "jupyterlab>=4",
    "jupyter-builder>=1.2.0",
]
lint = [
    "ruff>=0.6",
    "mypy>=1.10",
]
# Kernel-side helper (#6): JobSubmissionClient needs Ray. Kept optional so the
# per-user server pod isn't bloated with Ray; install with bifrost-jupyter[kernel].
kernel = [
    "ray[default]>=2.9",
]
test = [
    "coverage",
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "pytest-jupyter[server]>=0.6.0"
]

[tool.hatch.metadata]
# Required by hatchling to accept the `bifrost_client @ <url>` direct reference.
allow-direct-references = true

[tool.hatch.version]
source = "nodejs"

[tool.hatch.metadata.hooks.nodejs]
fields = ["description", "authors", "urls", "keywords"]

[tool.hatch.build.targets.sdist]
artifacts = ["bifrost_jupyter/labextension"]
exclude = [".github", "binder"]

[tool.hatch.build.targets.wheel.shared-data]
"bifrost_jupyter/labextension" = "share/jupyter/labextensions/bifrost-jupyter"
"install.json" = "share/jupyter/labextensions/bifrost-jupyter/install.json"
"jupyter-config/server-config" = "etc/jupyter/jupyter_server_config.d"

[tool.hatch.build.hooks.version]
path = "bifrost_jupyter/_version.py"

[tool.hatch.build.hooks.jupyter-builder]
dependencies = ["hatch-jupyter-builder>=0.5"]
build-function = "hatch_jupyter_builder.npm_builder"
ensured-targets = [
    "bifrost_jupyter/labextension/static/style.js",
    "bifrost_jupyter/labextension/package.json",
]
skip-if-exists = ["bifrost_jupyter/labextension/static/style.js"]

[tool.hatch.build.hooks.jupyter-builder.build-kwargs]
build_cmd = "build:prod"
npm = ["jlpm"]

[tool.hatch.build.hooks.jupyter-builder.editable-build-kwargs]
build_cmd = "install:extension"
npm = ["jlpm"]
source_dir = "src"
build_dir = "bifrost_jupyter/labextension"

[tool.jupyter-releaser.options]
version_cmd = "hatch version"

[tool.jupyter-releaser.hooks]
before-build-npm = [
    "python -m pip install 'jupyter-builder>=1.2.0,<2'",
    "jlpm",
    "jlpm build:prod"
]
before-build-python = ["jlpm clean:all"]

[tool.check-wheel-contents]
ignore = ["W002"]

[tool.ruff]
line-length = 100
target-version = "py310"
# Exclude the built labextension and template boilerplate that follows non-ruff
# idioms (the Jupyter `c` config global in ui-tests, release scripts).
extend-exclude = ["bifrost_jupyter/labextension", "node_modules", "ui-tests", ".github"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
files = ["bifrost_jupyter"]
exclude = "bifrost_jupyter/labextension"
